name: Independent Witness IW-002
on:
  push:
    branches: [main]
    paths:
      - 'experiments/IW-002/**'
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/IW-002
    steps:
      - uses: actions/checkout@v4
      - run: node witness.js
      - uses: actions/upload-artifact@v4
        with:
          name: independent-witness-IW-002
          path: experiments/IW-002/witness-result.json
